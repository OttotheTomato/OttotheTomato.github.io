<!DOCTYPE html>
<html>

<head>
    <title>
        Otto Perry | UX/Narrative Designer
    </title>
    <link rel="stylesheet" href="/main.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="utf-8" />
    <meta property="og:title" content="Otto Perry | UX/Narrative Designer" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ottop.me" />
    <script src="https://kit.fontawesome.com/cad1fde959.js" crossorigin="anonymous"></script>
    <meta property="description"
        content="UX/Narrative Game Designer currently studying at DigiPen Institute of Technology." />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(function () {
            $('#header').load('/header.html')
        });
    </script>
</head>

<body>
    <div class="mainContainer article">
        <header id="header" class="header"></header>
        <h1>Love's Meaty Claws</h1>
        <img src="\assets\LovesMeatyClaws\CrabCrabBig.jpg" style="display:block; width: 70%; margin: auto;">
        <p></p>
        <a class="linkButton" id="pdfholder" style="margin: 0 auto; z-index: 0; display: block; max-width: 200px;">Read
            The Script</a>
        <p>Listen to a recording of the script while you read!</p>
        <audio controls>
            <source src="/assets/LovesMeatyClaws/LovesMeatyClaws.ogg" type="audio/ogg">
            <source src="/assets/LovesMeatyClaws/LovesMeatyClaws.mp3" type="audio/mp3">
        </audio>
    </div>
    <div class="clearfix"></div>
    <div id="myModal" class="modal">
        <span class="close">x</span>
        <iframe class="modal-pdf" id="pdf01" title="PDF Reader">
        </iframe>
    </div>
    <script>
        var pdfLinks = "https://ottop.me/assets/LovesMeatyClaws/ClawCutscene.pdf#toolbar=0&navpanes=0&scrollbar=0"
        var modal = document.getElementById("myModal");

        var span = document.getElementsByClassName("close")[0];

        span.onclick = function () {
            modal.style.display = "none";
        }

        var pdfLink = document.getElementById("pdfholder")
        var modalFrame = document.getElementById("pdf01");
        pdfLink.addEventListener('click', function (event) {
            modal.style.display = "block";
            modalFrame.src = pdfLinks;
        })
    </script>
</body>
